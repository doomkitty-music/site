name: Migrate Doom Kitty site
on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import source and media
        run: |
          git remote add migration-source https://github.com/sjefvanleeuwen/doom-kitty.git
          git fetch migration-source main
          git read-tree migration-source/main
          git restore --source=HEAD --staged --worktree .github
          git checkout-index -a -f
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Migrate complete Doom Kitty site and media to doomkitty-music/site"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
